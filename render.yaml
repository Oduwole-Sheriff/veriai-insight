services:
  - type: web
    name: veriai-insight
    runtime: node

    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs

    envVars:
      - key: NODE_ENV
        value: production

      - key: NITRO_PRESET
        value: node-server

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: VITE_SUPABASE_PROJECT_ID
        sync: false

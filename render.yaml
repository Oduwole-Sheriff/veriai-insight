services:
  - type: web
    name: veriai-insight
    runtime: node

    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs

    envVars:
      - key: NODE_ENV
        value: production

      - key: NITRO_PRESET
        value: node-server

      # Server-only secrets (never VITE_ prefixed — must stay out of the browser bundle)
      - key: TAVILY_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false


      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: VITE_SUPABASE_PROJECT_ID
        sync: false

